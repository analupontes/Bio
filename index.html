<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDIRECIONANDO....</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #FFB6C1; 
            color: #FFFFFF;
        }
        .texto-carregamento {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="texto-carregamento">
        REDIRECIONANDO....
    </div>

    <script>
        // Link correto configurado diretamente
        const linkDestino = "https://jrway.vercel.app/analu"; 

        function dereferER() {
            // 1. Abre a guia atual como 'about:blank'
            const blankWindow = window.open('about:blank', '_self');
            
            // 2. Aguarda os 2 segundos (2000 milissegundos) na página em branco
            blankWindow.setTimeout(function() {
                // 3. Cria e dispara o link limpo sem o cabeçalho Referer
                const linkEscondido = blankWindow.document.createElement('a');
                linkEscondido.href = linkDestino;
                linkEscondido.rel = 'noreferrer';
                
                blankWindow.document.body.appendChild(linkEscondido);
                linkEscondido.click();
            }, 2000);
        }

        // Executa assim que a página rosa carrega
        window.onload = dereferER;
    </script>
</body>
</html>
