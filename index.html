<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDIRECIONANDO....</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #FFB6C1; 
            color: #FFFFFF;
        }
        .texto-carregamento {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="texto-carregamento">
        REDIRECIONANDO....
    </div>

    <script>
        // URL CORRIGIDA: jrway inserido corretamente
        const linkDestino = "https://jrway.vercel.app/analu"; 

        function iniciarContagem() {
            setTimeout(function() {
                
                const linkEscondido = document.createElement('a');
                linkEscondido.href = linkDestino;
                linkEscondido.rel = 'noreferrer noopener';
                linkEscondido.target = '_self'; 
                
                document.body.appendChild(linkEscondido);
                linkEscondido.click();
                
            }, 2000); 
        }

        window.onload = iniciarContagem;
    </script>
</body>
</html>
